; ============================================================
;  서버가 붙을 SQL Server 주소
;  Retry_Server.exe / Session_Manager.exe 와 같은 폴더에 둔다.
;  이 파일이 없으면 DbConfig.h 기본값(localhost\SQLEXPRESS)을 쓴다.
;
;  ★ 서버를 돌리는 PC에서 SSMS 로그인 창에 뜨는 "서버 이름" 그대로 적는다.
;    예) localhost\SQLEXPRESS    localhost\SQLEXPRESS04    localhost
; ============================================================
[db]
server=localhost\SQLEXPRESS
database=RetryDB
