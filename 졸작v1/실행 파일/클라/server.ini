; ============================================================
;  클라이언트가 붙을 로비 서버 주소
;  Retry.exe 와 같은 폴더에 둔다.
;
;  ip : 서버를 돌리는 PC의 IPv4 주소
;       그 PC에서 cmd -> ipconfig -> "IPv4 주소"
;  같은 PC에서 서버와 클라를 같이 돌리면 127.0.0.1
; ============================================================
[server]
ip=127.0.0.1
port=9000
