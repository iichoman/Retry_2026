; v2 기능 스위치. 왼쪽 값이 v1 방식, 오른쪽 값이 v2 방식.
[v2]
sync=queue      ; lock | queue   (세션 동기화: 성긴 락 / Custom 비멈춤 일감 큐)
log=async       ; sync | async   (로그: 전역 락 즉시 출력 / 로그 스레드)
send=batch      ; direct | batch (송신: 패킷마다 / 틱마다 묶어서)
tick=precise    ; sleep | precise (틱: 일 끝나고 50ms / 50ms 마감 기준)
power=high      ; default | high (윈도우 전력 절약 모드 해제)
